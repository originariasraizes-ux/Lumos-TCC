<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/Perfil.css">
</head>
<body>


  <!-- SIDEBAR -->
  <div class="sidebar">
    <a href="Homepage.html" class="logo">
      <img src="images/Logos/logoLumos.png" alt="Logo Lumos">
    </a>
    <nav class="navbar">
      <a href="CienciasNaturais.html">Ciências Naturais, Saúde e Meio Ambiente</a>
      <a href="CienciasHumanas.html">Ciências Humanas e Letras</a>
      <a href="CienciasExatas.html">Ciências Exatas</a>
      <a href="IdiomasComunicacao.html">Idiomas e Comunicação</a>
      <a href="Dashboard.html">Dashboard</a>
    </nav>
  </div>

  
  <!-- PERFIL CARD -->
  <div class="card" id="perfilCard">
    <div class="card-inner">
      <div class="profile-card">
        <h2 class="perfil-title">Seu Perfil</h2>
       <div class="banner">
<div class="avatar perfil-avatar">
  <img src="images/Perfil/usuario-removebg-preview.png" alt="Foto de Perfil" class="profile-img">
</div>
<button class="edit-btn" onclick="abrirConfiguracoes()">Editar Perfil</button>
</div>
        <div class="info">
          <br>
          <div class="name">Nome</div>
          <div class="bio">Bibliografia</div>
        </div>
        
        <h2>Jogos Favoritos</h2>
        <div class="favorites">
          <div class="fav"><span class="star">★</span></div>
          <div class="fav"><span class="star">★</span></div>
          <div class="fav"><span class="star">★</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- CONFIGURAÇÕES CARD -->
  <div class="card hidden" id="configCard">
    <div class="card-inner">
      <div class="profile-card">
        <h2 class="perfil-title">Configurações</h2>

        <!-- Banner -->
        <div class="banner" id="bannerPreview">
          <button class="edit-btn banner-btn" onclick="document.getElementById('bannerUpload').click()">Editar capa</button>
          <input type="file" id="bannerUpload" accept="image/*" class="hidden">
        </div>

        <div class="perfil-container">
          <!-- Coluna esquerda -->
          <div class="perfil-info">
            <div class="avatar config-avatar">
              <img src="images/Perfil/usuario-removebg-preview.png" alt="Foto de Perfil" id="photoPreview">
            </div>
            <button class="edit-btn" onclick="document.getElementById('photoUpload').click()">Editar foto</button>
            <input type="file" id="photoUpload" accept="image/*" class="hidden">
            
            <textarea id="bioInput" placeholder="Escreva aqui sua bibliografia..."></textarea>
          </div>

          <!-- Coluna direita -->
          <div class="forms-container">
            <label>Nome</label>
            <input type="text" id="nomeInput">
            <label>Email</label>
            <input type="email" id="emailInput">
            <label>Senha</label>
            <input type="password" id="senhaInput">

            <!-- Botões -->
            <div class="form-buttons">
              <button class="btn descartar" onclick="cancelarEdicao()">Descartar</button>
              <button class="btn salvar" onclick="salvarEdicao()">Salvar</button>
            </div>
            <button class="btn excluir" onclick="confirmarExclusao()">Excluir Conta</button>
          </div>
        </div>
      </div>
    </div>

    <!-- MODAL CONFIRMAÇÃO -->
    <div id="modalConfirm" class="hidden modal-overlay">
      <div class="modal-box">
        <p>Tem certeza de que deseja excluir sua conta? Este é um procedimento irreversível.</p>
        <div class="modal-buttons">
          <button onclick="fecharModal()">Voltar</button>
          <button onclick="excluirConta()">Excluir Conta</button>
        </div>
      </div>
    </div>
  </div>

  <script src="js/Perfil.js"></script>
</body>
</html>
